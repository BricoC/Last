name: "Pubblica Release & Aggiornamento Automatico"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install Rust 1.94
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install Node Dependencies
        run: npm ci

      - name: Run TypeScript Tests & Coverage
        run: npm run test:coverage

      - name: Check Frontend Build
        run: npm run build

      - name: Enforce Initial Bundle Budget
        run: npm run check:bundle

      - name: Check Rust Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Rust Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Build & Publish Release with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.SHAK_SIGNING_PRIVATE_KEY || secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Last ${{ github.ref_name }}"
          releaseBody: "Aggiornamento automatico Last Gestionale BricoClass."
          releaseDraft: false
          prerelease: false

